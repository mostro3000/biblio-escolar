<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <script>if('serviceWorker' in navigator){var _h=!!navigator.serviceWorker.controller,_r=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(_r)return;_r=true;if(_h)location.reload();});addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>

  <title>Mostrador · @@ESCUELA@@</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: start center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem; }
    .card { width: 100%; max-width: 28rem; background: var(--surface); border-radius: 1rem; padding: 1.75rem; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
    h1 { font-size: 1.2rem; margin: 0 0 1rem; }
    a.salir { color: var(--link); text-decoration: none; font-size: .8rem; }
    button { width: 100%; margin-top: .8rem; padding: .8rem; font-size: 1rem; font-weight: 600; border: none; border-radius: .6rem; background: #3b82f6; color: white; cursor: pointer; }
    button.sec { background: var(--border); } button.ok { background: #16a34a; } button.chip { width: auto; margin: .3rem .3rem 0 0; padding: .5rem .8rem; background: var(--border); font-size: .85rem; }
    button:disabled { opacity: .45; }
    select { width: 100%; margin-top: .8rem; padding: .7rem; border-radius: .6rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: .9rem; }
    video { width: 100%; border-radius: .6rem; margin-top: .8rem; background: #000; aspect-ratio: 4/3; object-fit: cover; }
    .hidden { display: none; }
    .msg { margin-top: 1rem; padding: .8rem; border-radius: .6rem; font-size: .9rem; display: none; }
    .msg.show { display: block; } .msg.no { background: rgba(239,68,68,.12); border: 1px solid #ef4444; } .msg.info { background: rgba(59,130,246,.12); border: 1px solid #3b82f6; } .msg.ok { background: rgba(34,197,94,.12); border: 1px solid #22c55e; }
    .alumno { background: var(--bg); border-radius: .6rem; padding: .9rem; margin-top: 1rem; }
    .alumno .n { font-size: 1.15rem; font-weight: 700; } .alumno .r { color: var(--muted); font-size: .8rem; text-transform: capitalize; }
    .alerta { color: var(--danger-text); font-size: .85rem; margin-top: .35rem; }
    .activos { color: var(--muted); font-size: .8rem; margin-top: .5rem; }
    h2 { font-size: .9rem; color: var(--link); margin: 1.25rem 0 .5rem; }
    .item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-radius: .5rem; padding: .55rem .8rem; margin-bottom: .4rem; font-size: .9rem; }
    .item .x { color: var(--danger-text); cursor: pointer; font-weight: 700; padding: 0 .3rem; }
    .vacio { color: #64748b; font-size: .85rem; }
    .manualrow { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; }
    .manualrow input { flex: 1; min-width: 0; padding: .65rem; border-radius: .6rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: .9rem; }
    .manualrow button { width: auto; margin: 0; flex: none; padding: .65rem .9rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="top"><h1>🏫 Mostrador — Préstamo</h1><a href="#" id="salir" class="salir">salir</a></div>
    <nav style="display:flex;flex-wrap:wrap;gap:.15rem .9rem;font-size:.8rem;margin:.2rem 0 1rem">
      <b style="color:var(--text)">Préstamo</b>
      <a href="/devolucion.html" style="color:var(--link);text-decoration:none">Devolución</a>
      <a href="/catalogo.html" style="color:var(--link);text-decoration:none">Catálogo</a>
      <a href="/ficha.html" style="color:var(--link);text-decoration:none">Ficha</a>
      <a href="/materiales.html" style="color:var(--link);text-decoration:none">Libros</a>
      <a href="/tech.html" style="color:var(--link);text-decoration:none">Tecnología</a>
      <a href="/reportes.html" style="color:var(--link);text-decoration:none;display:none">Reportes</a>
      <a href="/admin.html" style="color:var(--link);text-decoration:none;display:none">Admin</a>
    </nav>

    <!-- FASE 1: escanear alumno -->
    <section id="fase1">
      <p style="font-size:.9rem;color:var(--text2);margin:0">Escaneá el <b>QR del alumno</b> (cambia cada pocos segundos; con que esté a la vista alcanza).</p>
      <select id="camSelect" class="hidden"></select>
      <video id="video" playsinline muted class="hidden"></video>
      <button id="scanAlumno" type="button">📷 Escanear QR del alumno</button>
    </section>

    <!-- FASE 2: alumno + materiales -->
    <section id="fase2" class="hidden">
      <div class="alumno">
        <div class="n" id="al_nombre"></div>
        <div class="r" id="al_rol"></div>
        <div id="al_alertas"></div>
        <div class="activos" id="al_activos"></div>
      </div>

      <h2>Materiales a prestar</h2>
      <div id="carrito"><p class="vacio">Todavía no agregaste materiales.</p></div>
      <div id="copias"></div>
      <img id="scanCover" alt="tapa del libro escaneado" style="display:none;width:6rem;height:8.5rem;object-fit:cover;border-radius:.5rem;margin-top:.6rem;border:1px solid var(--border)">
      <button id="scanMaterial" type="button" class="sec">📷 Escanear material</button>
      <div class="manualrow">
        <input type="text" id="codManual" placeholder="o tipeá el ISBN / código" inputmode="numeric" autocomplete="off">
        <button id="codManualBtn" type="button" class="chip">Agregar</button>
      </div>
      <button id="confirmar" type="button" class="ok" disabled>Confirmar préstamo</button>
      <button id="otroAlumno" type="button" class="sec">Cambiar de alumno</button>
    </section>

    <div id="msg" class="msg"></div>
  </main>

  <script src="/vendor/zxing-library.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let alumno = null, carrito = [];
    // Formatos para materiales: ISBN es EAN-13; sumamos otros 1D por si una etiqueta usa otro símbolo.
    const MAT_FORMATS = [
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE,
    ].filter(f => f != null);
    function show(kind, text) { const m = $('msg'); m.textContent = text; m.className = 'msg show ' + kind; }
    function hideMsg() { $('msg').className = 'msg'; }
    function al401(r) { if (r.status === 401) { location.href = '/login.html'; return true; } return false; }

    // gate staff
    fetch('/api/auth/me').then(r => { if (!r.ok) location.href = '/login.html'; });
    $('salir').addEventListener('click', async (e) => { e.preventDefault(); await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {}); location.href = '/'; });

    // ---- escáner: usa el lector NATIVO del sistema (BarcodeDetector, ideal en Android/
    //      Chrome para EAN-13) y, si no existe, cae a ZXing. Cámara trasera recordada. ----
    const REAR_KEY = 'biblio_cam_rear_v2';
    // ZXing.BarcodeFormat (numérico) -> string que entiende BarcodeDetector
    const DET_FMT = new Map([
      [ZXing.BarcodeFormat.QR_CODE, 'qr_code'], [ZXing.BarcodeFormat.EAN_13, 'ean_13'],
      [ZXing.BarcodeFormat.EAN_8, 'ean_8'], [ZXing.BarcodeFormat.UPC_A, 'upc_a'],
      [ZXing.BarcodeFormat.UPC_E, 'upc_e'], [ZXing.BarcodeFormat.CODE_128, 'code_128'],
      [ZXing.BarcodeFormat.CODE_39, 'code_39'], [ZXing.BarcodeFormat.ITF, 'itf'],
    ]);
    const scan = { engine: null, stream: null, raf: null, reader: null, detector: null, formats: null, onResult: null, stopped: true };

    function filterRear(v) { const f = v.filter(d => /back|rear|trasera|environment/i.test(d.label)); return f.length ? f : v; }
    function defRear(p) { if (!p.length) return null; const s = localStorage.getItem(REAR_KEY); if (s && p.some(d => d.deviceId === s)) return s; const c0 = p.find(d => /\b0\b/.test(d.label)); return (c0 || p[0]).deviceId; }
    $('camSelect').addEventListener('change', (e) => { localStorage.setItem(REAR_KEY, e.target.value); restartScan(e.target.value); });

    async function listCams() {
      let cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      if (cams.length && !cams[0].label) {  // sin permiso aún → no hay labels; pedimos y reenumeramos
        try { const t = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } }); t.getTracks().forEach(x => x.stop()); } catch {}
        cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      }
      return cams;
    }

    async function escanear(formats, onResult) {
      scan.formats = formats; scan.onResult = onResult; scan.stopped = false;
      show('info', 'Apuntá al código…');
      try {
        const pool = filterRear(await listCams());
        if (pool.length > 1) { $('camSelect').innerHTML = pool.map((d, i) => `<option value="${d.deviceId}">${d.label || ('Cámara ' + (i + 1))}</option>`).join(''); $('camSelect').classList.remove('hidden'); }
        const def = defRear(pool); if (def) $('camSelect').value = def;
        await restartScan(def);
      } catch (e) { show('no', 'No se pudo abrir la cámara: ' + (e && e.message ? e.message : e)); }
    }

    async function restartScan(deviceId) {
      stopStream(); scan.stopped = false;
      $('video').classList.remove('hidden');
      $('video').scrollIntoView({ behavior: 'smooth', block: 'center' });   // bajar a la cámara
      const v = { width: { ideal: 1920 }, height: { ideal: 1080 } };
      if (deviceId) v.deviceId = { exact: deviceId }; else v.facingMode = { ideal: 'environment' };

      // ¿hay lector nativo y soporta los formatos que necesito?
      let detFormats = null;
      if ('BarcodeDetector' in window) {
        try {
          const sup = await window.BarcodeDetector.getSupportedFormats();
          detFormats = scan.formats.map(f => DET_FMT.get(f)).filter(Boolean).filter(s => sup.includes(s));
        } catch {}
      }

      if (detFormats && detFormats.length) {
        scan.engine = 'native';
        scan.detector = new window.BarcodeDetector({ formats: detFormats });
        try {
          scan.stream = await navigator.mediaDevices.getUserMedia({ video: v });
          $('video').srcObject = scan.stream;
          await $('video').play().catch(() => {});
          detectLoop();
        } catch { show('no', 'Esa cámara no abrió, probá otra.'); }
      } else {
        scan.engine = 'zxing';
        const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, scan.formats); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        scan.reader = new ZXing.BrowserMultiFormatReader(hints);
        try { await scan.reader.decodeFromConstraints({ video: v }, $('video'), (res) => { if (res && !scan.stopped) { const t = res.getText(); stopScan(); scan.onResult(t); } }); }
        catch { show('no', 'Esa cámara no abrió, probá otra.'); }
      }
    }

    async function detectLoop() {
      if (scan.stopped || scan.engine !== 'native') return;
      try {
        const codes = await scan.detector.detect($('video'));
        const val = codes && codes.length ? codes[0].rawValue : '';
        if (val) { stopScan(); scan.onResult(val); return; }
      } catch {}
      scan.raf = requestAnimationFrame(detectLoop);
    }

    function stopStream() {
      if (scan.raf) { cancelAnimationFrame(scan.raf); scan.raf = null; }
      try { if (scan.reader) scan.reader.reset(); } catch {}
      scan.reader = null;
      if (scan.stream) { scan.stream.getTracks().forEach(t => t.stop()); scan.stream = null; }
      $('video').srcObject = null;
    }
    function stopScan() { scan.stopped = true; stopStream(); $('video').classList.add('hidden'); $('camSelect').classList.add('hidden'); }

    // ---- FASE 1: alumno ----
    $('scanAlumno').addEventListener('click', () => escanear([ZXing.BarcodeFormat.QR_CODE], cargarAlumno));

    async function cargarAlumno(qr) {
      show('info', 'Buscando alumno…');
      try {
        const r = await fetch('/api/mostrador/persona/' + encodeURIComponent(qr));
        if (al401(r)) return;
        if (r.status === 404) { show('no', 'QR no reconocido o vencido. Que el alumno reabra su credencial y reintentá.'); return; }
        alumno = await r.json(); carrito = [];
        hideMsg(); pintarAlumno(); renderCarrito();
        $('fase1').classList.add('hidden'); $('fase2').classList.remove('hidden');
      } catch { show('no', 'Error de red. Reintentá.'); }
    }
    function pintarAlumno() {
      $('al_nombre').textContent = [alumno.nombre, alumno.apellido].filter(Boolean).join(' ') || ('DNI ' + alumno.dni);
      $('al_rol').textContent = alumno.rol;
      $('al_alertas').innerHTML = (alumno.alertas || []).map(a => `<div class="alerta">${a}</div>`).join('');
      const n = (alumno.prestamos_activos || []).length;
      $('al_activos').textContent = n ? `${n} préstamo(s) activo(s).` : 'Sin préstamos activos.';
    }

    // ---- FASE 2: materiales ----
    $('scanMaterial').addEventListener('click', () => escanear(MAT_FORMATS, resolverMaterial));
    $('codManualBtn').addEventListener('click', usarCodManual);
    $('codManual').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); usarCodManual(); } });
    function usarCodManual() {
      const c = $('codManual').value.trim();
      if (!c) { show('no', 'Ingresá un código o ISBN.'); return; }
      $('codManual').value = '';
      resolverMaterial(c);
    }

    async function resolverMaterial(codigo) {
      $('copias').innerHTML = ''; $('scanCover').style.display = 'none';
      show('info', 'Buscando material…');
      try {
        const r = await fetch('/api/mostrador/material?codigo=' + encodeURIComponent(codigo));
        if (al401(r)) return;
        const d = await r.json();
        if (d.kind === 'material') {
          if (!d.material.seleccionable) { show('no', `${d.material.descripcion} no está disponible (${d.material.estado}).`); return; }
          agregar(d.material.id, d.material.descripcion);
        } else if (d.kind === 'libro') {
          if (d.cover_url) { const sc = $('scanCover'); sc.src = d.cover_url; sc.style.display = ''; }  // verificar visualmente
          if (!d.copias.length) { show('no', `«${d.titulo}»: no hay copias disponibles.`); return; }
          if (d.copias.length === 1) { const c = d.copias[0]; agregar(c.id, `${d.titulo} (copia ${c.numero_copia})`); }
          else {
            hideMsg();
            $('copias').innerHTML = `<p class="vacio">«${d.titulo}» — elegí la copia:</p>` +
              d.copias.map(c => `<button class="chip" onclick="window._pick(${c.id},'${d.titulo.replace(/'/g, "")} (copia ${c.numero_copia})')">Copia ${c.numero_copia}</button>`).join('');
          }
        } else { show('no', d.mensaje || 'No se encontró el material.'); }
      } catch { show('no', 'Error de red. Reintentá.'); }
    }
    window._pick = (id, desc) => { $('copias').innerHTML = ''; agregar(id, desc); };

    function agregar(id, desc) {
      if (carrito.some(c => c.id === id)) { show('info', 'Ese material ya está en la lista.'); return; }
      carrito.push({ id, desc }); hideMsg(); renderCarrito();
    }
    function renderCarrito() {
      if (!carrito.length) { $('carrito').innerHTML = '<p class="vacio">Todavía no agregaste materiales.</p>'; }
      else { $('carrito').innerHTML = carrito.map((c, i) => `<div class="item"><span>${c.desc}</span><span class="x" onclick="window._del(${i})">✕</span></div>`).join(''); }
      $('confirmar').disabled = carrito.length === 0;
    }
    window._del = (i) => { carrito.splice(i, 1); renderCarrito(); };

    $('confirmar').addEventListener('click', async () => {
      const btn = $('confirmar'); btn.disabled = true; btn.textContent = 'Registrando…';
      try {
        const r = await fetch('/api/mostrador/prestamo', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ persona_id: alumno.persona_id, material_ids: carrito.map(c => c.id) }),
        });
        if (al401(r)) return;
        const d = await r.json();
        if (!r.ok) { show('no', d.detail || 'No se pudo registrar.'); }
        else { show('ok', d.mensaje); volverFase1(); }
      } catch { show('no', 'Error de red. Reintentá.'); }
      finally { btn.disabled = carrito.length === 0; btn.textContent = 'Confirmar préstamo'; }
    });

    $('otroAlumno').addEventListener('click', volverFase1);
    function volverFase1() { alumno = null; carrito = []; $('copias').innerHTML = ''; $('fase2').classList.add('hidden'); $('fase1').classList.remove('hidden'); }
  </script>
</body>
</html>
