<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="/base.css?v=4">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Biblioteca">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>if('serviceWorker' in navigator){var _h=!!navigator.serviceWorker.controller,_r=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(_r)return;_r=true;if(_h)location.reload();});addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
  <script src="/theme.js"></script>
  <title>Biblioteca · @@ESCUELA@@</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 1.5rem;
    }
    .card {
      width: 100%; max-width: 26rem; background: var(--surface); border-radius: 1rem;
      padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .85rem; margin: 0 0 1.5rem; }
    .status { display: flex; align-items: center; gap: .6rem; font-weight: 600; }
    .dot { width: .8rem; height: .8rem; border-radius: 50%; background: #64748b; flex: none; }
    .dot.ok { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.2); }
    .dot.err { background: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,.2); }
    pre {
      margin: 1rem 0 0; padding: .9rem; background: var(--bg); border-radius: .6rem;
      font-size: .8rem; overflow-x: auto; color: var(--text2);
    }
    .foot { margin-top: 1.25rem; font-size: .75rem; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📚 @@ESCUELA@@</h1>
    <p class="sub">Biblioteca · sistema de préstamos</p>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="label">Probando conexión con el backend…</span>
    </div>
    <pre id="out">—</pre>

    <p class="foot">Circuito: navegador → Apache → FastAPI (<code>/api/health</code>)</p>
  </main>

  <script>
    const dot = document.getElementById('dot');
    const label = document.getElementById('label');
    const out = document.getElementById('out');

    fetch('/api/health', { headers: { 'Accept': 'application/json' } })
      .then(r => r.json())
      .then(data => {
        const ok = data.status === 'ok';
        dot.className = 'dot ' + (ok ? 'ok' : 'err');
        label.textContent = ok ? 'Backend OK' : 'Backend respondió, pero no está OK';
        out.textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        dot.className = 'dot err';
        label.textContent = 'No se pudo contactar al backend';
        out.textContent = String(err);
      });
  </script>
</body>
</html>
